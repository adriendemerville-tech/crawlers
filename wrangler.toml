name = "crawlers-logger"
main = "public/cloudflare-worker-logger.js"
compatibility_date = "2024-09-01"
workers_dev = false

# ⚠️  CRITICAL — read before re-attaching routes:
# This Worker was previously attached to crawlers.fr/* and www.crawlers.fr/*
# and proxied human/Googlebot traffic to crawlers.lovable.app.
# Lovable's published app (crawlers.lovable.app) issues a 302 redirect to
# https://crawlers.fr/ for any request, which caused an infinite redirect loop
# (ERR_TOO_MANY_REDIRECTS) because the Worker kept forwarding the request
# back to itself.
#
# To restore the site we detached the routes. The Worker code is kept for
# reference, but it MUST NOT be attached to the main custom domain unless you
# have a non-redirecting origin endpoint. Use Cloudflare Logpush instead for
# HTTP logging on a Lovable custom domain.
#
# NEVER re-add crawlers.fr/* (redirect loop above).
#
# Narrow routes only: /functions/v1/* is proxied by the Worker to the backend
# Edge Functions (Lovable hosting returns 406 "Only HTML requests" on the
# custom domain for non-HTML requests, e.g. the MCP endpoint). Every other path
# never reaches the Worker, so no loop is possible.
#
# After editing: redeploy via the existing workflow (.github/workflows/
# deploy-cf-worker.yml or scripts/deploy-worker-wrangler.sh), then check in the
# Cloudflare dashboard (Workers Routes for zone crawlers.fr) that ONLY these two
# routes are attached to crawlers-logger.
routes = [
  { pattern = "crawlers.fr/functions/v1/*", zone_name = "crawlers.fr" },
  { pattern = "www.crawlers.fr/functions/v1/*", zone_name = "crawlers.fr" },
]

# Variables d'environnement non secrètes (les secrets se poussent via `wrangler secret put`)
